<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#10161d"/>
      <stop offset="100%" stop-color="#171015"/>
    </linearGradient>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3b3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5a5a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff5a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headTxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8e3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- ambient glow -->
  <circle cx="900" cy="120" r="260" fill="url(#glowSpot)"/>

  <!-- faint grid backdrop -->
  <g stroke="#2a3441" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Large barcode composition, right side -->
  <g transform="translate(700,40)">
    <g mask="none">
      <rect x="0" y="0" width="440" height="230" fill="none"/>
      <g fill="url(#barFade)">
        <rect x="0"   y="10" width="6"  height="210"/>
        <rect x="14"  y="10" width="3"  height="210"/>
        <rect x="24"  y="10" width="10" height="210"/>
        <rect x="42"  y="10" width="4"  height="210"/>
        <rect x="52"  y="10" width="6"  height="210"/>
        <rect x="66"  y="10" width="3"  height="210"/>
        <rect x="76"  y="10" width="12" height="210"/>
        <rect x="96"  y="10" width="4"  height="210"/>
        <rect x="108" y="10" width="6"  height="210"/>
        <rect x="122" y="10" width="3"  height="210"/>
        <rect x="132" y="10" width="8"  height="210"/>
        <rect x="148" y="10" width="4"  height="210"/>
        <rect x="160" y="10" width="10" height="210"/>
        <rect x="178" y="10" width="3"  height="210"/>
        <rect x="188" y="10" width="6"  height="210"/>
        <rect x="202" y="10" width="4"  height="210"/>
        <rect x="214" y="10" width="12" height="210"/>
        <rect x="234" y="10" width="3"  height="210"/>
        <rect x="244" y="10" width="6"  height="210"/>
        <rect x="258" y="10" width="4"  height="210"/>
        <rect x="270" y="10" width="8"  height="210"/>
        <rect x="286" y="10" width="3"  height="210"/>
        <rect x="296" y="10" width="10" height="210"/>
        <rect x="314" y="10" width="4"  height="210"/>
        <rect x="326" y="10" width="6"  height="210"/>
        <rect x="340" y="10" width="3"  height="210"/>
        <rect x="350" y="10" width="12" height="210"/>
        <rect x="370" y="10" width="4"  height="210"/>
        <rect x="382" y="10" width="6"  height="210"/>
        <rect x="396" y="10" width="3"  height="210"/>
        <rect x="406" y="10" width="8"  height="210"/>
        <rect x="422" y="10" width="4"  height="210"/>
        <rect x="434" y="10" width="6"  height="210"/>
      </g>
    </g>

    <!-- scanning laser beam -->
    <rect x="-10" y="96" width="460" height="30" fill="url(#scanGlow)"/>
    <line x1="-10" y1="111" x2="450" y2="111" stroke="#ff3b3b" stroke-width="2.5" opacity="0.95"/>
    <circle cx="450" cy="111" r="5" fill="#ff3b3b"/>
    <circle cx="-10" cy="111" r="5" fill="#ff3b3b"/>
  </g>

  <!-- small decorative code digits under barcode -->
  <text x="700" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="6" fill="#8a97a6" opacity="0.7">0 1 2 8 4 5 9 0 0 3 7 1</text>

  <!-- Headline & tagline left side -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#headTxt)" textLength="620" lengthAdjust="spacingAndGlyphs">Barcode Generator</text>

  <line x1="62" y1="182" x2="560" y2="182" stroke="#ff3b3b" stroke-width="3" opacity="0.85"/>

  <text x="60" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#b9c2cc" textLength="640" lengthAdjust="spacingAndGlyphs">No more manual barcode creation — just run and go</text>

  <!-- small terminal-like accent -->
  <g transform="translate(60,255)">
    <rect x="0" y="0" width="330" height="42" rx="8" fill="#0f1620" stroke="#2c3947" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="21" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="21" r="5" fill="#27c93f"/>
    <text x="78" y="27" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#9fb0c0" textLength="220" lengthAdjust="spacingAndGlyphs">$ barcode-gen --run</text>
  </g>
</svg>